name: CI / CD

on:
  # CI: runs on every PR targeting main or development (tests only, no deploy)
  pull_request:
    branches: [main, development]
  # CD: runs when a PR is merged into main (deploys to Azure)
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CI: .NET ────────────────────────────────────────────────────────────────
  # Restores, builds and runs all test projects via the solution file.
  test-backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x' # Stable .NET 10 (LTS)

      - name: Restore
        working-directory: ./skinet
        run: dotnet restore

      - name: Build
        working-directory: ./skinet
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: ./skinet
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ── CI: Angular ─────────────────────────────────────────────────────────────
  # npm ci installs exactly what is in package-lock.json (reproducible builds).
  test-frontend:
    name: Angular Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x' # Meets Angular 22 requirement (>=24.13.1)
          cache: 'npm'
          cache-dependency-path: skinet/client/package-lock.json

      - name: Install dependencies
        working-directory: ./skinet/client
        run: npm ci

      # Lint returns in T54 (ESLint setup); Angular unit tests are out of scope.
      # For now CI verifies the Angular app compiles.
      - name: Build
        working-directory: ./skinet/client
        run: npm run build

  # ── CD: Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Publish & Deploy to Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: skinet/client/package-lock.json

      - name: Install and build Angular
        working-directory: ./skinet/client
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x' # Aligned with CI for production stability

      # Publish only the API project (not the solution).
      # Angular build output is copied into wwwroot by the .csproj before publish.
      - name: Publish API
        working-directory: ./skinet/src/API
        run: dotnet publish -c Release -o "${{ env.DOTNET_ROOT }}/myapp"

      - name: Upload artifact
        uses: actions/upload-artifact@v7 # v7 supports unzipped artifacts (Feb 2026)
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: skinet-api
          package: ${{ env.DOTNET_ROOT }}/myapp