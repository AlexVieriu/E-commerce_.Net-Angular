<div class="w-full">
  <mat-radio-group
    class="grid grid-cols-2 gap-4"
    [value]="cartService.selectedDelivery()?.id"
    (change)="updateDeliveryMethod($event.value)"
  >
    @for (method of checkoutService.deliveryMethods(); track method.id) {
      <!-- Not a <label>: mat-radio-button has its own, and labels can't nest.
           The padding sits on the projected content, inside that label, so the whole box is clickable. -->
      <div class="border-line w-full h-full hover:bg-surface-2">
        <mat-radio-button
          class="w-full h-full"
          [value]="method"
          [checked]="cartService.selectedDelivery() === method"
        >
          <div class="flex flex-col w-full h-full p-3 cursor-pointer">
            <strong>{{ method.shortName }} - {{ method.price | currency }}</strong>
            <span class="text-sm">{{ method.description }}</span>
          </div>
        </mat-radio-button>
      </div>
    }
  </mat-radio-group>
</div>
