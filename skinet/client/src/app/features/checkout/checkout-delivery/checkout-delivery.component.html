<div class="w-full">
  <mat-radio-group
    class="grid grid-cols-2 gap-4"
    [value]="cartService.selectedDelivery()?.id"
    (change)="updateDeliveryMethod($event.value)"
  >
    @for (method of checkoutService.deliveryMethods(); track method.id) {
      <!-- Not a <label>: mat-radio-button renders its own internal label, and labels can't nest. -->
      <div class="p-3 border-gray-200 cursor-pointer w-full h-full hover:bg-purple-100">
        <mat-radio-button
          class="w-full h-full"
          [value]="method"
          [checked]="cartService.selectedDelivery() === method"
        >
          <div class="flex flex-col w-full h-full">
            <strong>{{ method.shortName }} - {{ method.price | currency }}</strong>
            <span class="text-sm">{{ method.description }}</span>
          </div>
        </mat-radio-button>
      </div>
    }
  </mat-radio-group>
</div>
