<div class="mx-auto mt-32">
  <h2 class="font-semibold text-2xl mb-6 text-center">My orders</h2>
  <div class="flex flex-col">
    <div class="w-full">
      <table class="min-w-full divide-y divide-line cursor-pointer">
        <thead class="bg-surface-2">
          <tr class="uppercase text-frost text-sm">
            <th class="text-center px-6 py-3">Order</th>
            <th class="text-left">Date</th>
            <th class="text-left">Total</th>
            <th class="text-left">Status</th>
          </tr>
        </thead>
        <tbody>
          @for (order of orders.value() ?? []; track order.id) {
            <tr routerLink="/orders/{{ order.id }}" class="hover:bg-surface-2">
              <th class="px-6 py-3"># {{ order.id }}</th>
              <td>{{ order.orderDate | date: 'dd/MM/yyyy, h:mm a' }}</td>
              <td>{{ order.total | currency }}</td>
              <td>{{ order.status }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
