@if (product.value()) {
  <section class="py-8">
    <div class="max-w-screen-2xl px-4 mx-auto">
      <div class="grid grid-cols-2 gap-8">
        <div class="max-w-xl mx-auto">
          <img class="w-full" src="{{ product.value()!.pictureUrl }}" alt="product image" />
        </div>

        <div>
          <h1 class="text-2xl font-semibold text-gray-900">{{ product.value()!.name }}</h1>

          <div class="mt-4 items-center gap-4 flex">
            <p class="text-3xl font-extrabold text-gray-900">
              {{ product.value()!.price | currency }}
            </p>
          </div>

          <div class="flex gap-6 mt-6 items-center">
            <button (click)="addOne()" mat-flat-button>
              <mat-icon>shopping_cart</mat-icon>
              Add to cart
            </button>

            <!-- The stepper edits the cart line, so it has nothing to show until there is one. -->
            @if (quantityInCart() > 0) {
              <div class="flex items-center gap-2">
                <span class="text-gray-500">In cart:</span>

                <button mat-icon-button (click)="removeOne()" aria-label="Remove one from cart">
                  <mat-icon class="text-red-500">remove</mat-icon>
                </button>

                <span class="font-semibold text-xl">{{ quantityInCart() }}</span>

                <button mat-icon-button (click)="addOne()" aria-label="Add one to cart">
                  <mat-icon class="text-green-600">add</mat-icon>
                </button>
              </div>
            }
          </div>

          <mat-divider class="mt-6"></mat-divider>

          <p class="mt-6 text-gray-500">
            {{ product.value()!.description }}
          </p>
        </div>
      </div>
    </div>
  </section>
}
