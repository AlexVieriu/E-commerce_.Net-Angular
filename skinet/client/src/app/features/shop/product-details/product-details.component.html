@if (product.value()) {
  <section class="py-8">
    <div class="max-w-screen-2xl px-4 mx-auto">
      <div class="grid grid-cols-2 gap-8">
        <div class="max-w-xl mx-auto">
          <img
            class="w-full rounded-xl bg-white p-4 ring-1 ring-line"
            [ngSrc]="product.value()!.pictureUrl"
            width="800"
            height="800"
            priority
            [alt]="product.value()!.name"
          />
        </div>

        <div>
          <h1 class="text-2xl font-semibold text-snow">{{ product.value()!.name }}</h1>

          <div class="mt-4 items-center gap-4 flex">
            <p class="text-3xl font-extrabold text-snow">
              {{ product.value()!.price | currency }}
            </p>
          </div>

          <div class="flex gap-6 mt-6 items-center">
            <button (click)="addOne()" mat-flat-button>
              <mat-icon>shopping_cart</mat-icon>
              Add to cart
            </button>

            <!-- Shown only when the product is in the cart. -->
            @if (quantityInCart() > 0) {
              <div class="flex items-center gap-2">
                <span class="text-frost">In cart:</span>

                <button mat-icon-button (click)="removeOne()" aria-label="Remove one from cart">
                  <mat-icon class="text-red-400">remove</mat-icon>
                </button>

                <span class="font-semibold text-xl">{{ quantityInCart() }}</span>

                <button mat-icon-button (click)="addOne()" aria-label="Add one to cart">
                  <mat-icon class="text-emerald-400">add</mat-icon>
                </button>
              </div>
            }
          </div>

          <mat-divider class="mt-6"></mat-divider>

          <p class="mt-6 text-frost">
            {{ product.value()!.description }}
          </p>
        </div>
      </div>
    </div>
  </section>
}
