@let p = shopParams();
@if (products.value()?.count) {
  <div class="flex flex-col gap-3">
    <div class="flex justify-between">
      <mat-paginator
        class="bg-white"
        (page)="handlePageEvent($event)"
        [length]="products.value()!.count"
        [pageSize]="p.pageSize"
        [showFirstLastButtons]="true"
        [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="p.pageNumber - 1"
        aria-label="Select page"
      >
      </mat-paginator>

      <form
        #searchForm="ngForm"
        (ngSubmit)="onSearchChange()"
        class="relative flex items-center w-full max-w-md mx-4"
      >
        <input
          type="search"
          class="block w-full p-4 text-sm text-gray-900 border border-gray-300 rounded-lg"
          placeholder="Search"
          name="search"
          [ngModel]="searchInput()"
          (ngModelChange)="searchInput.set($event)"
        />
        <button
          mat-icon-button
          type="submit"
          class="absolute inset-y-0 right-8 top-2 flex items-center pl-3"
        >
          <mat-icon>search</mat-icon>
        </button>
      </form>

      <div class="flex gap-3">
        <button class="match-input-height" mat-stroked-button (click)="openFiltersDialog()">
          <mat-icon>filter_list</mat-icon>
          Filters
        </button>
        <button class="match-input-height" mat-stroked-button [matMenuTriggerFor]="sortMenu">
          <mat-icon>swap_vert</mat-icon>
          Sort
        </button>
      </div>
    </div>

    <div class="grid grid-cols-5 gap-4">
      @for (product of products.value()!.data; track product.id) {
        <app-product-item [product]="product" [priority]="$index === 0"></app-product-item>
      }
    </div>
  </div>

  <mat-menu #sortMenu="matMenu">
    <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
      @for (sort of sortOptions; track $index) {
        <mat-list-option [value]="sort.value" [selected]="p.sort === sort.value">
          {{ sort.name }}
        </mat-list-option>
      }
    </mat-selection-list>
  </mat-menu>
} @else {
  <app-empty-state
    message="No products match this filter"
    icon="filter_alt_off"
    actionText="Clear filters"
    (action)="resetFilters()"
  />
}
